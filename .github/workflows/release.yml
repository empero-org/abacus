name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  ABACUS_NO_ACTIVITY: "1"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: abacus
          # 22.04, not 24.04: aarch64 links with GNU ld, which on 24.04 makes
          # the binary need glibc 2.39. Built here it needs 2.34, like x86_64.
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            binary: abacus
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: abacus
          - os: macos-15
            target: aarch64-apple-darwin
            binary: abacus
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: abacus.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Stage binary (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/${{ matrix.binary }} abacus-${{ matrix.target }}
      - name: Check the glibc it needs (Linux)
        if: runner.os == 'Linux'
        # The newest glibc version the binary cannot start without (a weak
        # need may be missing). 2.34 is Ubuntu 22.04, Debian 12 and RHEL 9.
        run: |
          need=$(readelf -V -W abacus-${{ matrix.target }} | awk '/Name: GLIBC_/ && $5 != "WEAK" { sub("GLIBC_", "", $3); print $3 }' | sort -uV | tail -n 1)
          echo "abacus-${{ matrix.target }} needs glibc $need"
          if [ "$(printf '%s\n' "$need" 2.34 | sort -V | tail -n 1)" != 2.34 ]; then
            echo "::error::abacus-${{ matrix.target }} needs glibc $need; a release must start on 2.34"
            exit 1
          fi
      - name: Stage binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item target/${{ matrix.target }}/release/${{ matrix.binary }} abacus-${{ matrix.target }}.exe
      - uses: actions/upload-artifact@v4
        with:
          name: abacus-${{ matrix.target }}
          path: abacus-${{ matrix.target }}*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check the DLLs it needs (Windows)
        # A VCRUNTIME or MSVCP import means the C runtime is linked dynamically
        # (see .cargo/config.toml): abacus.exe would not start on a Windows
        # without the Visual C++ Redistributable.
        working-directory: dist
        run: |
          exe=abacus-x86_64-pc-windows-msvc.exe
          dlls=$(objdump -p "$exe" | awk '/DLL Name:/ { print $3 }')
          echo "$exe needs:" $dlls
          if [ -z "$dlls" ]; then
            echo "::error::could not read the DLLs $exe needs"
            exit 1
          fi
          if echo "$dlls" | grep -iE '^(vcruntime|msvcp)'; then
            echo "::error::$exe needs the Visual C++ runtime; a release must start without it"
            exit 1
          fi
      - name: Generate checksums
        working-directory: dist
        run: sha256sum abacus-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
