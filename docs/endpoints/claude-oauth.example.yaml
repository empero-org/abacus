# Scripted endpoint: Anthropic Messages API via a Claude Code/Desktop OAuth token.
#
# Copy to ~/.abacus/endpoints/claude-oauth.yaml, then in ~/.abacus/config.toml:
#
#   [profiles.claude]
#   name = "Claude OAuth"
#   endpoint = "claude-oauth"
#
# Uses protocol: anthropic — the Messages API wire format (system array,
# max_tokens, input_schema tools, content_block SSE), not OpenAI-shaped.

name: Claude OAuth
url: https://api.anthropic.com/v1/messages
protocol: anthropic
model: claude-opus-4-8

# OAuth bearer, read fresh each request. Resolution mirrors claude_cot.py:
# (1) ANTHROPIC_AUTH_TOKEN or CLAUDE_CODE_OAUTH_TOKEN from the environment,
# (2) the token in the environment of the NEWEST live Claude Code/Desktop
# process, (3) the stored ~/.claude/.credentials.json token. The stored copy
# EXPIRES (observed 2026-03-30, then HTTP 401 "OAuth access token is
# invalid"/429), so a live process is preferred, but the file keeps working
# after a fresh `claude` login.
auth:
  command:
    - bash
    - -c
    - |
      # Mirror claude_cot.py's credential resolution order: env, then the
      # newest live process, then the stored credential file.
      v="${ANTHROPIC_AUTH_TOKEN:-${CLAUDE_CODE_OAUTH_TOKEN:-}}"
      [ -n "$v" ] && { printf '%s' "$v"; exit 0; }
      best=""
      for p in /proc/[0-9]*; do
        v=$(tr '\0' '\n' < "$p/environ" 2>/dev/null | sed -n 's/^CLAUDE_CODE_OAUTH_TOKEN=//p' | head -n1)
        [ -n "$v" ] || continue
        t=$(stat -c %Y "$p" 2>/dev/null || echo 0)
        if [ -z "$best" ] || [ "$t" -gt "${best%% *}" ]; then best="$t $v"; fi
      done 2>/dev/null
      if [ -n "$best" ]; then printf '%s' "${best#* }"; exit 0; fi
      f="$HOME/.claude/.credentials.json"
      if [ -f "$f" ] &&
        v=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["claudeAiOauth"]["accessToken"])' "$f" 2>/dev/null) &&
        [ -n "$v" ]
      then
        printf '%s' "$v"; exit 0
      fi
      echo "no Claude OAuth token: set ANTHROPIC_AUTH_TOKEN or CLAUDE_CODE_OAUTH_TOKEN, or start a Claude session" >&2
      exit 1

# The billing-attribution line MUST be its own leading system block, or raw
# OAuth calls are rate-limited (HTTP 429). system_prefix places it first.
system_prefix: "x-anthropic-billing-header: cc_version=2.1.215; cc_entrypoint=cli; cch=00000;"

# First-party Claude Code headers. {uuid} becomes a fresh per-session hex id.
headers:
  x-app: cli
  User-Agent: "claude-cli/2.1.215 (external, cli, agent-sdk/0.3.215)"
  X-Claude-Code-Session-Id: "{uuid}"
  anthropic-dangerous-direct-browser-access: "true"

# Optional: cap output, enable extended thinking, etc.
# body:
#   max_tokens: 16000
#   thinking:
#     type: enabled
#     budget_tokens: 16000
