<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0a0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<title>Abacus</title>
<style>
  :root {
    --bg: #0a0b0d;
    --raise: #12141a;
    --raise-2: #171a21;
    --line: #23262e;
    --ink: #e9ebef;
    --muted: #8b929e;
    --dim: #5e6570;
    --mint: #7dd3a0;
    --mint-dim: #24483a;
    --amber: #f0b45e;
    --red: #f2706b;
    --blue: #7aa7f0;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
  body {
    font: 15px/1.5 var(--sans);
    display: flex; flex-direction: column;
    overscroll-behavior-y: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  ::-webkit-scrollbar { width: 0; }

  /* ---------------------------------------------------------------- header */
  header {
    position: sticky; top: 0; z-index: 20;
    padding: calc(var(--safe-t) + 10px) 14px 8px;
    background: linear-gradient(#0a0b0df2, #0a0b0de6);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .row { display: flex; align-items: center; gap: 8px; min-width: 0; }
  #title {
    flex: 1; min-width: 0; font-weight: 600; font-size: 15px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); flex: none; }
  .dot.live { background: var(--mint); box-shadow: 0 0 8px var(--mint); }
  .dot.wait { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
  .dot.dead { background: var(--red); }
  .meta { margin-top: 4px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .chip {
    font-size: 11.5px; color: var(--muted); background: var(--raise);
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46vw;
  }
  .chip b { color: var(--ink); font-weight: 600; }
  .chip.tap:active { background: var(--raise-2); }
  .chip.accent { color: var(--mint); border-color: var(--mint-dim); }
  #workers-chip { display: none; }
  #workers-chip.on { display: inline-flex; gap: 5px; align-items: center; }

  /* -------------------------------------------------------------- transcript */
  #log {
    flex: 1; overflow-y: auto; padding: 14px 14px 4px;
    display: flex; flex-direction: column; gap: 10px;
    scroll-behavior: auto;
  }
  .entry { animation: rise .18s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .who { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); margin-bottom: 3px; }

  .user {
    align-self: flex-end; max-width: 88%;
    background: var(--mint-dim); border: 1px solid #2e5a48;
    padding: 9px 12px; border-radius: 16px 16px 4px 16px;
    white-space: pre-wrap; word-break: break-word;
  }
  .assistant { max-width: 100%; word-break: break-word; }
  .assistant p { margin: 0 0 9px; }
  .assistant p:last-child { margin-bottom: 0; }
  .assistant h1, .assistant h2, .assistant h3 { font-size: 15px; margin: 14px 0 6px; }
  .assistant ul, .assistant ol { margin: 0 0 9px; padding-left: 20px; }
  .assistant li { margin: 2px 0; }
  .assistant a { color: var(--blue); }
  .assistant code {
    font: 13px var(--mono); background: var(--raise-2);
    border: 1px solid var(--line); border-radius: 5px; padding: 1px 4px;
  }
  .assistant pre {
    margin: 0 0 9px; padding: 10px 11px; overflow-x: auto;
    background: #0e1014; border: 1px solid var(--line); border-radius: 10px;
  }
  .assistant pre code { background: none; border: 0; padding: 0; font-size: 12.5px; line-height: 1.55; }
  .assistant blockquote {
    margin: 0 0 9px; padding-left: 10px; border-left: 2px solid var(--line); color: var(--muted);
  }

  .reasoning { color: var(--muted); font-size: 13.5px; }
  .reasoning summary {
    list-style: none; cursor: pointer; color: var(--dim); font-size: 12px;
    display: flex; align-items: center; gap: 6px;
  }
  .reasoning summary::-webkit-details-marker { display: none; }
  .reasoning[open] summary { margin-bottom: 5px; }
  .reasoning .body { white-space: pre-wrap; border-left: 2px solid var(--line); padding-left: 10px; }
  .spinner {
    width: 10px; height: 10px; border-radius: 50%;
    border: 1.5px solid var(--dim); border-top-color: var(--mint);
    animation: spin .8s linear infinite; flex: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .system { color: var(--muted); font-size: 12.5px; text-align: center; padding: 2px 0; }
  .rule { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
  .error {
    color: #ffd7d5; background: #2a1414; border: 1px solid #56231f;
    padding: 9px 11px; border-radius: 10px; font-size: 13.5px; white-space: pre-wrap;
  }

  .tool {
    border: 1px solid var(--line); border-radius: 11px; background: var(--raise);
    overflow: hidden;
  }
  .tool-head {
    display: flex; align-items: center; gap: 8px; padding: 8px 11px; width: 100%; text-align: left;
  }
  .tool-name { font: 12px var(--mono); color: var(--mint); flex: none; }
  .tool-sum {
    flex: 1; min-width: 0; font: 12px var(--mono); color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tool-state { font-size: 11px; color: var(--dim); flex: none; }
  .tool-state.ok { color: var(--mint); }
  .tool-state.failed { color: var(--red); }
  .tool-out {
    border-top: 1px solid var(--line); margin: 0; padding: 9px 11px;
    font: 12px/1.5 var(--mono); color: #c6ccd6; white-space: pre-wrap; word-break: break-word;
    max-height: 46vh; overflow-y: auto; background: #0d0f13;
  }
  .tool-out[hidden] { display: none; }

  /* ----------------------------------------------------------------- status */
  #statusbar {
    padding: 6px 14px; font-size: 12px; color: var(--muted);
    display: flex; align-items: center; gap: 7px; min-height: 26px;
    border-top: 1px solid transparent;
  }
  #statusbar.busy { color: var(--ink); border-top-color: var(--line); }

  /* --------------------------------------------------------------- composer */
  footer {
    padding: 8px 12px calc(var(--safe-b) + 10px);
    background: #0a0b0df2; border-top: 1px solid var(--line);
    backdrop-filter: blur(12px);
  }
  .composer {
    display: flex; align-items: flex-end; gap: 8px;
    background: var(--raise); border: 1px solid var(--line);
    border-radius: 20px; padding: 6px 6px 6px 12px;
  }
  .composer:focus-within { border-color: #33414a; }
  #input {
    flex: 1; min-height: 26px; max-height: 34vh; resize: none;
    background: none; border: 0; outline: none; color: var(--ink);
    font: 15px/1.45 var(--sans); padding: 5px 0;
  }
  #input::placeholder { color: var(--dim); }
  .round {
    width: 34px; height: 34px; border-radius: 50%; flex: none;
    display: grid; place-items: center; font-size: 16px;
  }
  #slash { color: var(--muted); font: 17px var(--mono); }
  #send { background: var(--mint); color: #06251a; }
  #send:disabled { background: var(--raise-2); color: var(--dim); }
  #stop { background: #2a1414; color: var(--red); border: 1px solid #56231f; display: none; }
  #stop.on { display: grid; }
  .hint { margin-top: 6px; font-size: 11px; color: var(--dim); text-align: center; }

  /* ----------------------------------------------------------------- sheets */
  .sheet-wrap { position: fixed; inset: 0; z-index: 40; display: none; }
  .sheet-wrap.open { display: block; }
  .scrim { position: absolute; inset: 0; background: #000a; animation: fade .15s; }
  @keyframes fade { from { opacity: 0; } }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: var(--raise); border-top: 1px solid var(--line);
    border-radius: 18px 18px 0 0; padding: 14px 16px calc(var(--safe-b) + 16px);
    max-height: 86vh; overflow-y: auto; animation: up .2s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes up { from { transform: translateY(24px); opacity: .4; } }
  .sheet h2 { margin: 0 0 4px; font-size: 15px; }
  .sheet .sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; white-space: pre-wrap; }
  .btn {
    display: block; width: 100%; text-align: left; padding: 12px 14px; margin-bottom: 8px;
    background: var(--raise-2); border: 1px solid var(--line); border-radius: 12px; font-size: 14.5px;
  }
  .btn:active { background: #1e222b; }
  .btn small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .btn.primary { background: var(--mint); color: #06251a; border-color: var(--mint); font-weight: 600; }
  .btn.danger { color: #ffd7d5; border-color: #56231f; background: #22100f; }
  .btn.ghost { background: none; }
  .btn.off { opacity: .45; }
  .btn-row { display: flex; gap: 8px; }
  .btn-row .btn { margin-bottom: 0; }

  /* action rows: icon, label, note, state tag */
  .handle { width: 38px; height: 4px; border-radius: 2px; background: #2b303a; margin: 0 auto 12px; }
  .group { margin: 2px 0 4px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
  .rows { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .row {
    display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
    padding: 10px 12px; background: var(--raise-2); border: 1px solid var(--line);
    border-radius: 12px;
  }
  .row:active { background: #1e222b; }
  .row .ico { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center;
    background: #0e1014; border: 1px solid var(--line); color: var(--muted); flex: none; }
  .row.on .ico { color: var(--mint); border-color: var(--mint-dim); }
  .row .txt { flex: 1; min-width: 0; }
  .row .txt b { font-weight: 550; font-size: 14.5px; }
  .row .txt small { display: block; color: var(--muted); font-size: 12px; margin-top: 1px; }
  .row .tag { font-size: 10.5px; color: var(--mint); border: 1px solid var(--mint-dim);
    border-radius: 999px; padding: 1px 7px; flex: none; }
  .row.danger .ico { color: var(--red); border-color: #56231f; }
  .row.danger b { color: #ffd7d5; }
  .field {
    width: 100%; background: #0d0f13; color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px;
    font: 14.5px var(--sans); margin-bottom: 10px; outline: none; resize: none;
  }
  .field:focus { border-color: #33414a; }
  .opts { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .opt {
    display: flex; gap: 10px; align-items: flex-start; padding: 11px 12px;
    background: var(--raise-2); border: 1px solid var(--line); border-radius: 11px;
  }
  .opt.sel { border-color: var(--mint); background: #16241d; }
  .opt .mark {
    width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--dim);
    flex: none; margin-top: 2px; display: grid; place-items: center; font-size: 10px;
  }
  .opt.sel .mark { border-color: var(--mint); background: var(--mint); color: #06251a; }
  .opt .label { font-size: 14px; }
  .opt .desc { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  pre.diff {
    margin: 0 0 12px; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--line);
    background: #0d0f13; font: 11.5px/1.5 var(--mono); max-height: 40vh; overflow: auto;
  }
  .diff .add { color: #9fe3b5; }
  .diff .del { color: #f0a0a0; }
  .diff .hunk { color: var(--blue); }
  .diff .meta { color: var(--dim); }
  pre.cmd {
    margin: 0 0 12px; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: #0d0f13; font: 12.5px/1.5 var(--mono); color: #c6ccd6;
    white-space: pre-wrap; word-break: break-word; max-height: 40vh; overflow: auto;
  }
  .worker {
    display: flex; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--line);
  }
  .worker:last-child { border-bottom: 0; }
  .worker .name { font: 12.5px var(--mono); color: var(--ink); }
  .worker .state { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); }
  .worker .state.running { color: var(--mint); border-color: var(--mint-dim); }
  .worker .state.done { color: var(--muted); }
  .worker .state.failed { color: var(--red); border-color: #56231f; }
  .worker .state.stopped { color: var(--amber); }
  .worker .act { color: var(--muted); font-size: 12.5px; margin-top: 3px; word-break: break-word; }
  .worker .tok { color: var(--dim); font-size: 11px; margin-top: 3px; }
  .empty { color: var(--dim); font-size: 13px; padding: 10px 0; }

  #toast {
    position: fixed; left: 50%; bottom: calc(var(--safe-b) + 84px); transform: translateX(-50%) translateY(8px);
    background: #22262f; border: 1px solid var(--line); color: var(--ink);
    padding: 9px 14px; border-radius: 999px; font-size: 13px; max-width: 86vw;
    opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; z-index: 60;
    text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.bad { border-color: #56231f; color: #ffd7d5; }
</style>
</head>
<body>

<header>
  <div class="row">
    <span id="dot" class="dot"></span>
    <div id="title">Abacus</div>
    <button id="workers-chip" class="chip tap"><span id="workers-count">0</span> workers</button>
  </div>
  <div class="meta">
    <span id="model" class="chip"><b>model</b></span>
    <span id="mode" class="chip tap">mode</span>
    <span id="usage" class="chip">0 tok</span>
  </div>
</header>

<main id="log"></main>
<div id="statusbar"><span id="status-text">connecting…</span></div>

<footer>
  <div class="composer">
    <button id="slash" class="round" aria-label="Actions">/</button>
    <textarea id="input" rows="1" placeholder="Message Abacus…" enterkeyhint="send"></textarea>
    <button id="stop" class="round" aria-label="Stop">■</button>
    <button id="send" class="round" aria-label="Send">↑</button>
  </div>
  <div class="hint" id="hint">tap / for actions · stop ends the turn</div>
</footer>

<div id="toast"></div>

<!-- approval -->
<div class="sheet-wrap" id="approval-sheet">
  <div class="scrim" data-close></div>
  <div class="sheet">
    <div class="handle"></div>
    <h2 id="ap-tool">Approval</h2>
    <div class="sub" id="ap-summary"></div>
    <div id="ap-body"></div>
    <button class="btn primary" data-decide="allow">Allow once</button>
    <button class="btn" data-decide="always">Allow for the rest of the session</button>
    <button class="btn danger" data-decide="deny">Reject</button>
  </div>
</div>

<!-- question -->
<div class="sheet-wrap" id="question-sheet">
  <div class="scrim" data-close></div>
  <div class="sheet">
    <div class="handle"></div>
    <h2 id="q-header">Question</h2>
    <div class="sub" id="q-text"></div>
    <div class="opts" id="q-options"></div>
    <textarea class="field" id="q-custom" rows="2" placeholder="Or type an answer…"></textarea>
    <button class="btn primary" id="q-submit">Answer</button>
  </div>
</div>

<!-- actions -->
<div class="sheet-wrap" id="actions-sheet">
  <div class="scrim" data-close></div>
  <div class="sheet">
    <div class="handle"></div>
    <h2>Actions</h2>
    <div class="sub" id="actions-sub">What the terminal can do from here.</div>
    <div id="actions-list"></div>
  </div>
</div>

<!-- workers -->
<div class="sheet-wrap" id="workers-sheet">
  <div class="scrim" data-close></div>
  <div class="sheet">
    <div class="handle"></div>
    <h2>Subagents</h2>
    <div class="sub" id="workers-sub">Workers this session started.</div>
    <div id="workers-list"></div>
    <button class="btn primary" id="delegate">Delegate a task…</button>
  </div>
</div>

<!-- delegate -->
<div class="sheet-wrap" id="delegate-sheet">
  <div class="scrim" data-close></div>
  <div class="sheet">
    <div class="handle"></div>
    <h2>Delegate</h2>
    <div class="sub">The agent starts one subagent per line, in parallel.</div>
    <textarea class="field" id="delegate-text" rows="4" placeholder="e.g. Audit the auth module for missing checks"></textarea>
    <div class="btn-row" style="margin-bottom:10px">
      <button class="btn" data-role="general" style="flex:1">General<small>may edit and test</small></button>
      <button class="btn" data-role="explore" style="flex:1">Explore<small>read-only research</small></button>
    </div>
    <div class="sub" style="margin:0">Tap a role to start.</div>
  </div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const log = $("log");
const input = $("input");

const S = {
  ws: null,
  attempts: 0,
  seq: 0,
  entries: new Map(),
  order: [],
  status: { state: "idle", label: "" },
  session: null,
  usage: { total: 0 },
  workers: [],
  approval: null,
  question: null,
  chosen: new Set(),
  pages: new Map(),
  snapshotId: null,
  follow: true,
  pendingRefs: new Set(),
};

/* ------------------------------------------------------------------ socket */

function token() { return new URLSearchParams(location.search).get("t") || ""; }

function connect() {
  const scheme = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${scheme}://${location.host}/ws?t=${encodeURIComponent(token())}`);
  S.ws = ws;
  setConn("wait");
  ws.onopen = () => {
    S.attempts = 0;
    setConn("live");
    send("request_snapshot", {});
  };
  ws.onmessage = (event) => {
    let frame;
    try { frame = JSON.parse(event.data); } catch { return; }
    handle(frame);
  };
  ws.onclose = () => {
    setConn("dead");
    const wait = Math.min(8000, 500 * Math.pow(1.6, S.attempts++));
    $("status-text").textContent = "reconnecting…";
    setTimeout(connect, wait);
  };
  ws.onerror = () => {};
}

function send(type, payload) {
  if (!S.ws || S.ws.readyState !== 1) { toast("Not connected", true); return null; }
  const id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
  S.ws.send(JSON.stringify({ v: 1, type, id, seq: ++S.seq, payload }));
  return id;
}

function setConn(kind) {
  const dot = $("dot");
  dot.className = "dot " + (kind === "live" ? "live" : kind === "wait" ? "wait" : "dead");
}

/* ------------------------------------------------------------------ frames */

function handle(frame) {
  const p = frame.payload || {};
  switch (frame.type) {
    case "hello":
      if (p.peers && p.peers.agent === false) $("status-text").textContent = "the terminal is not attached";
      break;
    case "ping": send("pong", { ts: p.ts }); break;
    case "snapshot": onSnapshot(p); break;
    case "entry": onEntry(p); break;
    case "delta": onDelta(p); break;
    case "tool": onTool(p); break;
    case "status": onStatus(p); break;
    case "usage": S.usage = p; renderMeta(); break;
    case "approval": onApproval(p); break;
    case "approval_resolved": onApprovalResolved(p); break;
    case "question": onQuestion(p); break;
    case "question_resolved": onQuestionResolved(p); break;
    case "mode": if (S.session) { S.session.mode = p.mode; renderMeta(); } break;
    case "notice": push({ id: "n" + Math.random(), kind: "system", text: p.text }, true); break;
    case "error": push({ id: "err" + Math.random(), kind: "error", text: p.message }, true); break;
    case "done": onDone(p); break;
    case "accepted": onAccepted(p); break;
    case "workers": onWorkers(p); break;
    case "pong": case "peer_state": break;
  }
}

function onSnapshot(p) {
  if (!S.pages.has(p.snapshot_id)) S.pages = new Map();
  S.pages.set(p.snapshot_id, p);
  const total = p.page ? p.page.count : 1;
  if (S.pages.size < total) return;
  const pages = [...S.pages.values()].sort((a, b) => a.page.index - b.page.index);
  const head = pages[0];
  S.pages = new Map();
  if (head.session) S.session = head.session;
  if (head.usage) S.usage = head.usage;
  if (head.status) S.status = head.status;
  if (head.workers) S.workers = head.workers.workers || [];
  S.approval = (head.pending && head.pending.approval) || null;
  S.question = (head.pending && head.pending.question) || null;
  S.entries.clear();
  S.order = [];
  log.innerHTML = "";
  for (const page of pages) for (const entry of page.entries || []) push(entry, false);
  renderMeta();
  renderStatus();
  renderWorkers();
  if (S.approval) openApproval(S.approval); else closeSheet("approval-sheet");
  if (S.question) openQuestion(S.question); else closeSheet("question-sheet");
  scrollBottom();
}

function onEntry(p) {
  if (!p.entry) return;
  if (p.phase === "start") {
    push(p.entry, true);
  } else {
    const known = S.entries.get(p.entry.id);
    if (known) { Object.assign(known, p.entry); paint(p.entry.id); }
    else push(p.entry, true);
  }
}

function onDelta(p) {
  const known = S.entries.get(p.entry_id);
  if (!known) {
    push({ id: p.entry_id, kind: p.kind === "reasoning" ? "reasoning" : "assistant", text: p.text }, true);
    return;
  }
  known.text = (known.text || "") + p.text;
  paint(p.entry_id);
}

function onTool(p) {
  const known = S.entries.get(p.entry_id);
  const tool = {
    call_id: p.call_id, name: p.name, summary: p.summary,
    status: p.status, output: p.output || "", output_clipped: p.output_clipped,
    duration_ms: p.duration_ms,
  };
  if (!known) {
    push({ id: p.entry_id, kind: "tool", text: "", tool }, true);
    return;
  }
  known.tool = Object.assign(known.tool || {}, tool);
  paint(p.entry_id);
}

function onStatus(p) {
  S.status = p;
  renderStatus();
}

function onDone(p) {
  S.status = { state: "idle", label: "" };
  if (p.usage) S.usage = p.usage;
  renderStatus();
  renderMeta();
  renderComposer();
}

function onAccepted(p) {
  if (p.result === "rejected") toast(p.reason || "rejected", true);
}

function onWorkers(p) {
  S.workers = p.workers || [];
  renderWorkers();
}

function onApproval(p) {
  S.approval = p;
  openApproval(p);
  renderStatus();
}

function onApprovalResolved(p) {
  S.approval = null;
  closeSheet("approval-sheet");
  const label = p.decision === "reject" ? "rejected" : p.decision === "always" ? "allowed for the session" : "allowed";
  push({ id: "resolved-" + p.approval_id, kind: "system", text: label + " · " + (p.by || "phone") }, true);
}

function onQuestion(p) {
  S.question = p;
  S.chosen = new Set();
  openQuestion(p);
  renderStatus();
}

function onQuestionResolved(p) {
  S.question = null;
  closeSheet("question-sheet");
  const answer = [...(p.selected || []), p.custom].filter(Boolean).join(", ");
  if (answer) push({ id: "answered-" + p.question_id, kind: "system", text: "answered: " + answer }, true);
}

/* ------------------------------------------------------------------- render */

const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" };
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ESC[c]);

function markdown(text) {
  const blocks = [];
  let rest = String(text || "").replace(/```([\w+-]*)\n?([\s\S]*?)(?:```|$)/g, (_, lang, code) => {
    blocks.push(`<pre><code>${esc(code.replace(/\n$/, ""))}</code></pre>`);
    return `\u0000${blocks.length - 1}\u0000`;
  });
  rest = esc(rest);
  rest = rest
    .replace(/`([^`\n]+)`/g, (_, code) => `<code>${code}</code>`)
    .replace(/^### (.*)$/gm, "<h3>$1</h3>")
    .replace(/^## (.*)$/gm, "<h2>$1</h2>")
    .replace(/^# (.*)$/gm, "<h1>$1</h1>")
    .replace(/^\s*[-*] (.*)$/gm, "<li>$1</li>")
    .replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, "<ul>$1</ul>")
    .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<i>$2</i>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noreferrer">$2</a>');
  const paras = rest.split(/\n{2,}/).map((chunk) => {
    const trimmed = chunk.trim();
    if (!trimmed) return "";
    if (/^<(h\d|ul|pre|blockquote)/.test(trimmed) || /^\u0000\d+\u0000$/.test(trimmed)) return trimmed;
    return "<p>" + trimmed.replace(/\n/g, "<br>") + "</p>";
  });
  return paras.join("").replace(/\u0000(\d+)\u0000/g, (_, at) => blocks[Number(at)]);
}

function el(tag, cls, html) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (html != null) node.innerHTML = html;
  return node;
}

function entryNode(entry) {
  const kind = entry.kind;
  if (kind === "user") return el("div", "entry user", esc(entry.text));
  if (kind === "assistant") return el("div", "entry assistant", markdown(entry.text));
  if (kind === "reasoning") {
    const details = el("details", "entry reasoning");
    const summary = el("summary", null, `<span class="spinner"></span><span>thinking</span>`);
    details.appendChild(summary);
    details.appendChild(el("div", "body", esc(entry.text)));
    return details;
  }
  if (kind === "tool") {
    const card = el("div", "entry tool");
    const head = el("button", "tool-head");
    const tool = entry.tool || {};
    head.innerHTML =
      `<span class="tool-name">${esc(tool.name || "tool")}</span>` +
      `<span class="tool-sum">${esc(tool.summary || "")}</span>` +
      `<span class="tool-state ${esc(tool.status || "")}">${statusWord(tool)}</span>`;
    const out = el("pre", "tool-out");
    out.hidden = true;
    out.textContent = tool.output || "";
    head.onclick = () => { out.hidden = !out.hidden; };
    card.append(head, out);
    return card;
  }
  if (kind === "error") return el("div", "entry error", esc(entry.text));
  if (kind === "rule") return el("hr", "rule");
  return el("div", "entry system", esc(entry.text));
}

function statusWord(tool) {
  if (tool.status === "running") return "running";
  if (tool.status === "failed") return "failed";
  const ms = tool.duration_ms;
  return ms != null ? `${(ms / 1000).toFixed(ms < 10000 ? 1 : 0)}s` : "done";
}

function push(entry, autoscroll) {
  if (S.entries.has(entry.id)) { Object.assign(S.entries.get(entry.id), entry); paint(entry.id); return; }
  S.entries.set(entry.id, entry);
  S.order.push(entry.id);
  const node = entryNode(entry);
  node.dataset.id = entry.id;
  log.appendChild(node);
  if (autoscroll && S.follow) scrollBottom();
}

function paint(id) {
  const entry = S.entries.get(id);
  const node = log.querySelector(`[data-id="${CSS.escape(id)}"]`);
  if (!entry || !node) return;
  if (entry.kind === "tool") {
    const tool = entry.tool || {};
    const sum = node.querySelector(".tool-sum");
    const state = node.querySelector(".tool-state");
    const out = node.querySelector(".tool-out");
    if (sum) sum.textContent = tool.summary || "";
    if (state) { state.textContent = statusWord(tool); state.className = "tool-state " + (tool.status || ""); }
    if (out) out.textContent = tool.output || "";
    return;
  }
  if (entry.kind === "reasoning") {
    const body = node.querySelector(".body");
    if (body) body.textContent = entry.text || "";
    return;
  }
  if (entry.kind === "assistant") { node.innerHTML = markdown(entry.text); return; }
  node.textContent = entry.text || "";
  if (S.follow) scrollBottom();
}

function renderMeta() {
  const session = S.session || {};
  $("title").textContent = session.title || "Abacus";
  $("model").innerHTML = `<b>${esc(shortModel(session.model))}</b>`;
  $("mode").textContent = session.mode || "mode";
  const total = (S.usage && S.usage.total) || 0;
  $("usage").textContent = total >= 1000 ? (total / 1000).toFixed(1) + "k tok" : total + " tok";
}

function shortModel(model) {
  if (!model) return "model";
  const parts = String(model).split("/");
  return parts[parts.length - 1].replace(/^.*:/, "");
}

function renderStatus() {
  const bar = $("statusbar");
  const busy = S.status.state && S.status.state !== "idle";
  bar.classList.toggle("busy", !!busy);
  const text = busy ? (S.status.label || S.status.state.replace(/_/g, " ")) : "ready";
  $("status-text").textContent = text;
  renderComposer();
}

function renderComposer() {
  const busy = S.status.state && S.status.state !== "idle";
  $("stop").classList.toggle("on", !!busy);
  $("send").disabled = !input.value.trim();
}

function renderWorkers() {
  const running = S.workers.filter((w) => w.state === "running").length;
  const chip = $("workers-chip");
  chip.classList.toggle("on", S.workers.length > 0);
  $("workers-count").textContent = running || S.workers.length;
  const list = $("workers-list");
  list.innerHTML = "";
  if (!S.workers.length) {
    list.appendChild(el("div", "empty", "No subagents yet. Tap Delegate to start one."));
    return;
  }
  for (const worker of S.workers) {
    const row = el("div", "worker");
    row.innerHTML =
      `<div style="flex:1;min-width:0">` +
      `<div class="row"><span class="name">${esc(worker.name)}</span>` +
      `<span class="state ${esc(worker.state)}">${esc(worker.state)}</span></div>` +
      `<div class="act">${esc(worker.activity || worker.role)}</div>` +
      `<div class="tok">${esc(worker.role)} · ${esc(worker.model || "default")} · ${worker.tokens || 0} tok</div>` +
      `</div>`;
    list.appendChild(row);
  }
}

function scrollBottom() {
  requestAnimationFrame(() => { log.scrollTop = log.scrollHeight; });
}

log.addEventListener("scroll", () => {
  S.follow = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
});

/* ------------------------------------------------------------------ sheets */

function openSheet(id) { $(id).classList.add("open"); }
function closeSheet(id) { $(id).classList.remove("open"); }

document.querySelectorAll("[data-close]").forEach((node) => {
  node.addEventListener("click", () => node.parentElement.classList.remove("open"));
});

function openApproval(approval) {
  $("ap-tool").textContent = approval.tool || "Approval";
  $("ap-summary").textContent = approval.summary || "";
  const body = $("ap-body");
  body.innerHTML = "";
  if (approval.kind === "diff") {
    const pre = el("pre", "diff");
    pre.innerHTML = approval.details.split("\n").map((line) => {
      const cls = line.startsWith("+++") || line.startsWith("---") ? "meta"
        : line.startsWith("+") ? "add" : line.startsWith("-") ? "del"
        : line.startsWith("@@") ? "hunk" : "";
      return `<span class="${cls}">${esc(line)}</span>`;
    }).join("\n");
    body.appendChild(pre);
  } else if (approval.kind === "command") {
    body.appendChild(el("pre", "cmd", esc(approval.details)));
  } else {
    body.appendChild(el("pre", "cmd", esc(approval.details)));
  }
  if (approval.details_clipped) body.appendChild(el("div", "sub", "… preview clipped"));
  openSheet("approval-sheet");
}

document.querySelectorAll("[data-decide]").forEach((button) => {
  button.addEventListener("click", () => {
    const approval = S.approval;
    if (!approval) { closeSheet("approval-sheet"); return; }
    send("approve", { approval_id: approval.approval_id, decision: button.dataset.decide });
    S.approval = null;
    closeSheet("approval-sheet");
  });
});

function openQuestion(question) {
  $("q-header").textContent = question.header || "Question";
  $("q-text").textContent = question.text || "";
  $("q-custom").value = "";
  const box = $("q-options");
  box.innerHTML = "";
  for (const option of question.options || []) {
    const node = el("button", "opt");
    node.innerHTML =
      `<span class="mark"></span><span style="flex:1;min-width:0">` +
      `<div class="label">${esc(option.label)}</div>` +
      (option.description ? `<div class="desc">${esc(option.description)}</div>` : "") +
      `</span>`;
    node.onclick = () => {
      if (question.multi) {
        if (S.chosen.has(option.label)) S.chosen.delete(option.label); else S.chosen.add(option.label);
      } else {
        S.chosen = new Set([option.label]);
      }
      box.querySelectorAll(".opt").forEach((other) => {
        const label = other.querySelector(".label").textContent;
        const on = S.chosen.has(label);
        other.classList.toggle("sel", on);
        other.querySelector(".mark").textContent = on ? "✓" : "";
      });
    };
    box.appendChild(node);
  }
  openSheet("question-sheet");
}

$("q-submit").addEventListener("click", () => {
  const question = S.question;
  if (!question) { closeSheet("question-sheet"); return; }
  const custom = $("q-custom").value.trim();
  send("answer", { question_id: question.question_id, selected: [...S.chosen], custom: custom || null });
  S.question = null;
  closeSheet("question-sheet");
});

/* ----------------------------------------------------------------- actions */

const ICONS = {
  plus: '<path d="M12 5v14M5 12h14"/>',
  fork: '<path d="M7 4v5a4 4 0 0 0 4 4h5"/><circle cx="17" cy="13" r="3"/>',
  compact: '<path d="M4 9h16M4 15h16M8 4 5 7l3 3M16 20l3-3-3-3"/>',
  tag: '<path d="M4 4h8l8 8-8 8-8-8z"/><circle cx="8.5" cy="8.5" r="1.2"/>',
  shield: '<path d="M12 3l7 3v5.5c0 4.2-2.9 7.1-7 8.5-4.1-1.4-7-4.3-7-8.5V6z"/>',
  users: '<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17.5" cy="7.5" r="2.4"/><path d="M17 14c2.4.3 4 2.4 4 5"/>',
  stop: '<rect x="6" y="6" width="12" height="12" rx="2"/>',
};

function icon(name) {
  return '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" ' +
    'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + (ICONS[name] || "") + "</svg>";
}

const ACTIONS = [
  { group: "Session", name: "new", label: "New session", note: "Start a fresh conversation", icon: "plus", args: "" },
  { group: "Session", name: "fork", label: "Fork", note: "Continue as a copy, keeping this one", icon: "fork", args: "" },
  { group: "Session", name: "compact", label: "Compact", note: "Shrink the history in place", icon: "compact", args: "" },
  { group: "Session", name: "rename", label: "Rename", note: "Give this session a title", icon: "tag", args: null },
  { group: "Mode", name: "mode", label: "Auto", note: "Read and edit freely, review the rest", icon: "shield", args: "auto", mode: "auto" },
  { group: "Mode", name: "mode", label: "YOLO", note: "Run everything without review", icon: "shield", args: "yolo", mode: "yolo" },
];

function row(spec, { on = false, danger = false, tag = "", onClick }) {
  const node = el("button", "row" + (on ? " on" : "") + (danger ? " danger" : ""));
  node.innerHTML =
    `<span class="ico">${icon(spec.icon)}</span>` +
    `<span class="txt"><b>${esc(spec.label)}</b><small>${esc(spec.note)}</small></span>` +
    (tag ? `<span class="tag">${esc(tag)}</span>` : "");
  node.onclick = onClick;
  return node;
}

function groupTitle(text) {
  return el("div", "group", esc(text));
}

function openActions() {
  const list = $("actions-list");
  list.innerHTML = "";
  const workspace = S.session && S.session.workspace ? S.session.workspace : "";
  const name = workspace.split("/").filter(Boolean).pop() || "";
  $("actions-sub").textContent = name ? `Workspace · ${name}` : "What the terminal can do from here.";

  let group = "";
  let box = null;
  for (const action of ACTIONS) {
    if (action.group !== group) {
      group = action.group;
      list.appendChild(groupTitle(group));
      box = el("div", "rows");
      list.appendChild(box);
    }
    const current = action.mode && S.session && S.session.mode === action.mode;
    box.appendChild(row(action, {
      on: !!current,
      tag: current ? "current" : "",
      onClick: () => {
        if (action.args === null) { promptArg(action); return; }
        send("command", { name: action.name, args: action.args });
        closeSheet("actions-sheet");
      },
    }));
  }

  list.appendChild(groupTitle("Subagents"));
  const workers = el("div", "rows");
  const running = S.workers.filter((worker) => worker.state === "running").length;
  workers.appendChild(row(
    { label: "Subagents", note: "See what the workers are doing", icon: "users" },
    { tag: running ? `${running} running` : "", onClick: () => { closeSheet("actions-sheet"); renderWorkers(); openSheet("workers-sheet"); } },
  ));
  workers.appendChild(row(
    { label: "Delegate a task", note: "Start a subagent on something", icon: "plus" },
    { onClick: () => { closeSheet("actions-sheet"); openSheet("delegate-sheet"); } },
  ));
  list.appendChild(workers);

  const busy = S.status.state && S.status.state !== "idle";
  if (busy) {
    list.appendChild(groupTitle("Turn"));
    const stop = el("div", "rows");
    stop.appendChild(row(
      { label: "Stop the turn", note: "Interrupt what is running", icon: "stop" },
      { danger: true, onClick: () => { send("interrupt", {}); closeSheet("actions-sheet"); } },
    ));
    list.appendChild(stop);
  }
  openSheet("actions-sheet");
}

function promptArg(action) {
  const value = window.prompt(action.label, "");
  if (value == null) return;
  const args = value.trim();
  if (!args) { toast("Nothing entered", true); return; }
  send("command", { name: action.name, args });
  closeSheet("actions-sheet");
}

$("slash").addEventListener("click", openActions);
$("mode").addEventListener("click", openActions);
$("model").addEventListener("click", openActions);
$("workers-chip").addEventListener("click", () => { renderWorkers(); openSheet("workers-sheet"); });
$("delegate").addEventListener("click", () => { closeSheet("workers-sheet"); openSheet("delegate-sheet"); });

document.querySelectorAll("[data-role]").forEach((button) => {
  button.addEventListener("click", () => {
    const text = $("delegate-text").value.trim();
    if (!text) { toast("Describe the task first", true); return; }
    const role = button.dataset.role;
    const lines = text.split("\n").map((line) => line.trim()).filter(Boolean);
    const prompt =
      `Use spawn_subagents with ${lines.length} ${role === "explore" ? "explore" : "general"} worker` +
      `${lines.length === 1 ? "" : "s"} to handle these tasks in parallel, then report what came back:\n` +
      lines.map((line, index) => `${index + 1}. ${line}`).join("\n");
    send("prompt", { text: prompt });
    $("delegate-text").value = "";
    closeSheet("delegate-sheet");
    toast("Delegating…");
  });
});

/* ----------------------------------------------------------------- composer */

function autoGrow() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, Math.round(window.innerHeight * 0.34)) + "px";
  $("send").disabled = !input.value.trim();
}

input.addEventListener("input", autoGrow);
input.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
    event.preventDefault();
    submit();
  }
});

function submit() {
  const text = input.value.trim();
  if (!text) return;
  send("prompt", { text });
  input.value = "";
  autoGrow();
  S.follow = true;
}

$("send").addEventListener("click", submit);
$("stop").addEventListener("click", () => send("interrupt", {}));

/* -------------------------------------------------------------------- toast */

let toastTimer = null;
function toast(text, bad) {
  const node = $("toast");
  node.textContent = text;
  node.classList.toggle("bad", !!bad);
  node.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => node.classList.remove("show"), 2600);
}

/* --------------------------------------------------------------------- boot */

renderMeta();
renderStatus();
renderWorkers();
connect();
setInterval(() => { if (S.ws && S.ws.readyState === 1) send("ping", { ts: new Date().toISOString() }); }, 25000);
</script>
</body>
</html>
